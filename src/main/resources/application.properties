spring.application.name=e-khadamet
server.servlet.context-path=/api
spring.datasource.url=jdbc:mysql://localhost:3306/ekhadamet?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDataTimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
spring.main.allow-bean-definition-overriding=true
spring.sql.init.mode=always
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
jwt.secret=your-super-long-random-secret-key-min-32-characters-2025
sms.provider=twilio
twilio.account.sid=your_account_sid_here
twilio.auth.token=your_auth_token_here
twilio.phone.number=+14155238886 
sms.expiration.minutes=10
# SMS.to credentials ? replace with your actual values from sms.to dashboard
sms.to.api.key=your_actual_api_key_here_very_long_string
sms.to.sender.id=E-Khadamet          # or your brand name / approved sender ID

# Message template (you can keep or change)
sms.otp.message.template=Your verification code is {code}. Valid for 10 minutes. Do not share.